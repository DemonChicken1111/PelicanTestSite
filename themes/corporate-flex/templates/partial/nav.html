<nav> 
    <ul>
        {% for title, link in MENUITEMS %}
            <li><a href="{{ link }}">{{ title }}</a></li>
        {% endfor %}
        
        {% if DISPLAY_PAGES_ON_MENU -%}
            {% for pg in pages %}
            <li{% if pg == page %} class="active"{% endif %}>
                <a href="{{ SITEURL }}/{{ pg.url }}">
                    {{ pg.title }}
                </a>
            </li>
            {% endfor %}
        {% endif %}
    </ul>
</nav>
